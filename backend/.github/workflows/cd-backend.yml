name: Backend CD

on:
  workflow_run:
    workflows:
      - Backend CI
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd ${{ secrets.APP_PATH }}

            git pull origin main

            pnpm install --no-frozen-lockfile

            pnpm prisma generate

            pnpm run build

            pm2 restart assessment-integrity-backend || pm2 start dist/server.js --name assessment-integrity-backend

            pm2 save