# Render Blueprint Specification for IntegrityOS
# Deploys Frontend (Static Site) and Backend (Node Web Service) as two separate cloud instances.

services:
  # ============================================================================
  # 1. BACKEND INSTANCE: Node.js / Express Web Service
  # ============================================================================
  - type: web
    name: integrityos-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    # Applies committed migrations; falls back to a non-destructive db push for a
    # database that was originally created with db push (never --accept-data-loss).
    # Install EXACTLY the tested versions from pnpm-lock.yaml. `npm install` ignores
    # that lockfile and pulled better-auth 1.7.x, which broke every sign-in.
    buildCommand: npx -y pnpm@10.15.1 install --frozen-lockfile --prod=false --ignore-workspace && npx prisma generate && (npx prisma migrate deploy || npx prisma db push) && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false # set in the Render dashboard; never commit secrets
      - key: NEON_DATABASE_URL
        sync: false # set in the Render dashboard; never commit secrets
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        fromService:
          type: web
          name: integrityos-backend
          property: host
      - key: FRONTEND_URL
        fromService:
          type: web
          name: integrityos-frontend
          property: host
      - key: ADMIN_EMAIL
        sync: false # set in the Render dashboard; never commit secrets
      - key: ADMIN_PASSWORD
        sync: false # set in the Render dashboard; never commit secrets
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_CHAT_MODEL
        value: openai/gpt-oss-120b
      - key: LLM_PROVIDER
        value: groq
      # Code execution: free Render can't run a sandbox. Point these at a Judge0
      # server (infra/judge0) to enable compiling; until then runs report
      # "execution service unavailable". Never set ALLOW_UNSANDBOXED_CODE here.
      - key: JUDGE0_URL
        sync: false
      - key: JUDGE0_AUTH_TOKEN
        sync: false
      - key: SMTP_USER
        sync: false # set in the Render dashboard; never commit secrets
      - key: SMTP_PASS
        sync: false # set in the Render dashboard; never commit secrets
      # Google sign-in (OAuth). Same client ID as the frontend's VITE_GOOGLE_CLIENT_ID.
      - key: GOOGLE_CLIENT_ID
        sync: false # set in the Render dashboard; never commit secrets
      - key: GOOGLE_CLIENT_SECRET
        sync: false # set in the Render dashboard; never commit secrets

  # ============================================================================
  # 2. FRONTEND INSTANCE: React / Vite Static Web Service
  # ============================================================================
  - type: web
    name: integrityos-frontend
    runtime: static
    rootDir: .
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: integrityos-backend
          property: host
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: integrityos-backend
          property: host
      - key: VITE_GROQ_API_KEY
        sync: false
      - key: VITE_GROQ_MODEL
        value: openai/gpt-oss-120b
      # Google One Tap / sign-in button. Vite bakes this in at build time, so
      # set it in the dashboard, then redeploy (a restart alone is not enough).
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
