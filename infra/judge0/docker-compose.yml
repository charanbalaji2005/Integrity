# Judge0 CE 1.13.1 — isolated code execution for the Vigil coding environment.
#
#   cd infra/judge0
#   docker compose up -d
#
# Every program runs inside an `isolate` sandbox (no network, cgroup CPU/memory/
# process limits, private filesystem, destroyed after the run). The containers
# must be privileged so isolate can create those cgroups. The API is bound to
# localhost only; put it behind your private network in production.
# Secrets live in judge0.conf (git-ignored). See README.md.

x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    privileged: true
    depends_on: [db, redis]
    <<: *default-logging
    restart: always

  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    depends_on: [db, redis]
    <<: *default-logging
    restart: always

  db:
    image: postgres:16.2
    env_file: judge0.conf
    volumes:
      - judge0-data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: always

  redis:
    image: redis:7.2.4
    command: ["bash", "-c", 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']
    env_file: judge0.conf
    <<: *default-logging
    restart: always

volumes:
  judge0-data:
